<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YEP!! Countdown</title>

<style type="text/css">

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #fffdf8;
    background-color: #062f32;
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
}

.scene {
    width: 100%;
    height: 100%;
    display: table;
    text-align: center;
}

.content {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    padding: 20px;
}

.eyebrow {
    font-size: 24px;
    letter-spacing: 5px;
    font-weight: bold;
    color: #bde9d9;
    margin-bottom: 20px;
}

.tagline {
    font-size: 48px;
    letter-spacing: 5px;
    font-weight: bold;
    margin: 15px 0;
}

.sub {
    font-size: 20px;
    margin-top: 10px;
}

.countdown {
    margin-top: 45px;
}

.unit {
    display: inline-block;
    padding: 30px 70px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 16px;
    background-color: rgba(2,31,33,0.75);
}

.number {
    font-size: 150px;
    font-weight: bold;
    line-height: 1.1;
}

.label {
    margin-top: 15px;
    font-size: 24px;
    letter-spacing: 6px;
    color: #bde9d9;
    font-weight: bold;
}

.date-note {
    display: none;
    margin-top: 35px;
    font-size: 30px;
    color: #e5c783;
    font-weight: bold;
    letter-spacing: 3px;
}

.finished .countdown {
    display: none;
}

.finished .date-note {
    display: block;
}

@media screen and (max-width: 700px) {
    .eyebrow {
        font-size: 14px;
        letter-spacing: 2px;
    }

    .tagline {
        font-size: 25px;
        letter-spacing: 2px;
    }

    .sub {
        font-size: 13px;
    }

    .unit {
        padding: 20px 35px;
    }

    .number {
        font-size: 80px;
    }

    .label {
        font-size: 16px;
        letter-spacing: 4px;
    }
}

</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="content">

        <div class="eyebrow">
            MBI &amp; HTSA &middot; YEAR END CELEBRATION 2026
        </div>

        <div class="tagline">
            ANDA LAYAK DAPAT BINTANG
        </div>

        <div class="sub">
            The countdown to Bali has officially begun
        </div>

        <div class="countdown" id="countdown">
            <div class="unit">
                <div class="number" id="days">--</div>
                <div class="label">DAYS</div>
            </div>
        </div>

        <div class="date-note">
            IT'S TIME FOR YEP!!
        </div>

    </div>

</div>

<script type="text/javascript">

/* EVENT DATE: 16 December 2026, 18:00 WITA */

var EVENT_DATE = "2026-12-16T18:00:00+08:00";
var target = new Date(EVENT_DATE).getTime();

function updateCountdown() {

    var now = new Date().getTime();
    var diff = target - now;

    var daysElement = document.getElementById("days");
    var sceneElement = document.getElementById("scene");

    if (isNaN(target)) {
        daysElement.innerHTML = "ERR";
        return;
    }

    if (diff <= 0) {
        daysElement.innerHTML = "00";
        sceneElement.className = "scene finished";
        return;
    }

    var days = Math.floor(diff / 86400000);

    daysElement.innerHTML = days;
}

updateCountdown();
setInterval(updateCountdown, 1000);


/* AUTOMATIC BACKGROUND */

function updateBackground() {

    var hour = new Date().getHours();
    var image;

    if (hour >= 6 && hour < 15) {
        image = "YEP-countdown-daylight.png";
    } else if (hour >= 15 && hour < 18) {
        image = "YEP-countdown-sunset.png";
    } else {
        image = "YEP-countdown-night.png";
    }

    document.body.style.backgroundImage =
        "linear-gradient(rgba(4,35,38,0.35), rgba(4,35,38,0.55)), url('" +
        image + "')";

    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center center";
    document.body.style.backgroundRepeat = "no-repeat";
}

updateBackground();
setInterval(updateBackground, 60000);

</script>

</body>
</html>
